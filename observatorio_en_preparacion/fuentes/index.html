<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El árbol urbano como hábitat: las fuentes · Observatorio del Arbolado de Temuco</title>
<meta name="description" content="Las fuentes científicas sobre el árbol urbano como hábitat: 18 referencias con DOI, qué se ha estudiado en Chile y en Temuco, y los límites de esa búsqueda.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<style>
  :root {
    --canopy:#12352a; --canopy-deep:#0c241d; --green:#6f9a4a; --green-soft:#8fb56a;
    --ember:#c85a2b; --cement:#8f897a;
    --bg:#f3f5ee; --bg-2:#eaeee2; --card:#ffffff;
    --ink:#17241d; --ink-2:#46584d; --ink-3:#6c7d70;
    --line:#d7ddcd; --accent:#3f7241;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1310; --bg-2:#111a15; --card:#16211b;
      --ink:#e8efe4; --ink-2:#a9bcac; --ink-3:#7c8f80;
      --line:#24332a; --accent:#8fb56a; --cement:#9a9384;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    line-height:1.65; -webkit-font-smoothing:antialiased; }

  /* ---- barra superior, igual que el sitio ---- */
  .top { position:sticky; top:0; z-index:20; background:var(--canopy); color:#eaf3e2;
    border-bottom:1px solid rgba(255,255,255,.08); }
  .top-in { max-width:860px; margin:0 auto; padding:13px 22px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .top a { color:#eaf3e2; text-decoration:none; font-size:.88rem; }
  .top .marca { font-weight:640; letter-spacing:-.01em; }
  .top .volver { margin-left:auto; opacity:.85; border:1px solid rgba(255,255,255,.25);
    padding:5px 12px; border-radius:20px; }
  .top .volver:hover { opacity:1; background:rgba(255,255,255,.08); }

  /* ---- contenido ---- */
  main { max-width:860px; margin:0 auto; padding:38px 22px 90px; }
  .doc-tag { display:inline-block; font-size:.7rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:10px; }

  h1 { font-family:var(--serif); font-size:2rem; line-height:1.2; letter-spacing:-.015em;
    margin:0 0 .5em; color:var(--ink); }
  h2 { font-family:var(--serif); font-size:1.42rem; line-height:1.25; margin:2.1em 0 .6em;
    padding-bottom:.3em; border-bottom:2px solid var(--accent); color:var(--ink); }
  h3 { font-size:1.08rem; margin:1.7em 0 .5em; color:var(--ink); }
  h4 { font-size:.97rem; margin:1.4em 0 .4em; color:var(--ink-2); }
  p, li { color:var(--ink-2); }
  p { margin:0 0 1.05em; }
  strong { color:var(--ink); }
  a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px; }

  ul, ol { padding-left:22px; margin:0 0 1.05em; }
  li { margin-bottom:.42em; }

  hr { border:0; border-top:1px solid var(--line); margin:2.4em 0; }

  blockquote { margin:1.2em 0; padding:16px 20px; background:var(--card);
    border-left:4px solid var(--accent); border-radius:0 11px 11px 0; }
  blockquote p:last-child { margin-bottom:0; }
  blockquote p { font-size:.94rem; }

  code { font-family:var(--mono); font-size:.86em; background:var(--bg-2);
    padding:2px 6px; border-radius:5px; color:var(--ink); }
  pre { background:var(--canopy-deep); color:#dfe9d6; padding:16px 18px; border-radius:11px;
    overflow-x:auto; font-size:.84rem; line-height:1.55; }
  pre code { background:none; padding:0; color:inherit; }

  .tabla-wrap { overflow-x:auto; margin:1.2em 0; }
  table { border-collapse:collapse; width:100%; font-size:.88rem; }
  th, td { border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top; }
  th { background:var(--bg-2); color:var(--ink); font-weight:640; }
  tbody tr:nth-child(even) td { background:var(--card); }

  /* ---- pie ---- */
  .pie { border-top:1px solid var(--line); margin-top:48px; padding-top:20px;
    font-size:.82rem; color:var(--ink-3); }
  .pie a { color:var(--accent); }

  .cargando, .error { padding:40px 0; color:var(--ink-3); font-size:.94rem; }
  .error strong { color:var(--ember); }

  @media (max-width:640px){ h1{font-size:1.6rem;} main{padding:26px 18px 70px;} }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <a class="marca" href="../index.html">🌳 Observatorio del Arbolado</a>
    <a class="volver" href="../index.html#descargas">← Volver al sitio</a>
  </div>
</div>

<main>
  <span class="doc-tag" id="tag">Fuentes y evidencia</span>
  <div id="contenido"><p class="cargando">Cargando documento…</p></div>
  <div class="pie">
    Observatorio Ciudadano del Arbolado Urbano de Temuco ·
    <a href="../index.html">Volver al sitio</a> ·
    <a id="crudo" href="#">Ver el archivo original</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script>
(function(){
  const caja = document.getElementById('contenido');

  // Solo se aceptan nombres de archivo .md de esta misma carpeta: evita que
  // alguien use el visor para cargar contenido de otro origen.
  const pedido = 'BIODIVERSIDAD_ARBOLADO_URBANO.md';
  const nombre = /^[A-Za-z0-9_-]+\.md$/.test(pedido) ? pedido : '';

  if (!nombre) {
    caja.innerHTML = '<p class="error"><strong>No se indicó un documento válido.</strong> ' +
      'Vuelve a <a href="../index.html#descargas">la sección de descargas</a> y elige uno.</p>';
    return;
  }
  document.getElementById('crudo').href = '../recursos/' + nombre;

  fetch('../recursos/' + nombre)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(md => {
      marked.setOptions({ gfm:true, breaks:false, headerIds:true, mangle:false });
      caja.innerHTML = marked.parse(md);

      // El aviso "Version con formato" solo tiene sentido en el archivo crudo:
      // aqui ya estamos viendo la version con formato, asi que sobra.
      const primera = caja.querySelector('blockquote');
      if (primera && /Versi.n con formato/.test(primera.textContent)) primera.remove();

      // el primer h1 del documento pasa a ser el titulo de la pestaña
      const h1 = caja.querySelector('h1');
      if (h1) document.title = h1.textContent.trim() + ' · Observatorio del Arbolado';

      // las tablas anchas se desplazan solas en vez de romper el ancho de la pagina
      caja.querySelectorAll('table').forEach(t => {
        const env = document.createElement('div');
        env.className = 'tabla-wrap';
        t.parentNode.insertBefore(env, t);
        env.appendChild(t);
      });

      // los enlaces externos se abren en otra pestaña
      caja.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank'; a.rel = 'noopener';
      });
    })
    .catch(e => {
      caja.innerHTML = '<p class="error"><strong>No se pudo cargar el documento.</strong> ' +
        'Puedes <a href="' + nombre + '">abrir el archivo original</a>. (' + e.message + ')</p>';
    });
})();
</script>
</body>
</html>
