<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Invitación Ekuwün horizontal</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  :root{
    --verde-osc:#0d4f44;
    --verde:#17705f;
    --lima:#9ccc3c;
    --lima-claro:#e4f2c4;
    --crema:#fbf7ec;
    --arena:#f3dfae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--crema)}
  body{width:960px;height:540px;overflow:hidden;font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased}
  .lienzo{position:relative;width:960px;height:540px;display:flex}

  /* Panel de texto */
  .panel{position:relative;width:470px;flex:none;background:var(--verde-osc);color:#fff;padding:30px 36px 26px 40px;display:flex;flex-direction:column;overflow:hidden}
  .marca{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lima)}
  .logo{align-self:flex-start;background:#fff;border-radius:14px;padding:9px 14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .logo img{display:block;width:150px;height:auto}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:50px;line-height:.98;margin:16px 0 12px;letter-spacing:-.01em}
  h1 span{color:var(--lima)}
  .bajada{font-size:16.5px;font-weight:700;line-height:1.4;color:#e9f3ee;max-width:380px}
  .bajada b{color:var(--lima)}

  .encuentro{margin-top:auto;display:flex;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08)}
  .calendario{background:var(--lima);color:var(--verde-osc);width:116px;flex:none;text-align:center;padding:12px 6px 10px;display:flex;flex-direction:column;justify-content:center}
  .calendario .dia-sem{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .calendario .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:56px;line-height:.95}
  .calendario .mes{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
  .detalles{padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .dato{display:flex;align-items:center;gap:11px}
  .dato svg{flex:none;width:24px;height:24px}
  .dato .grande{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;line-height:1.1}
  .dato .peq{font-size:12.5px;color:#cfe5dc;font-weight:600}

  .lema{margin-top:14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:var(--lima-claro)}
  .lema span{color:var(--lima)}

  .hoja{position:absolute;opacity:.14}
  .hoja.h1{right:-40px;top:-30px;width:170px;transform:rotate(25deg)}
  .hoja.h2{right:22px;top:200px;width:58px;transform:rotate(-40deg);opacity:.1}

  /* Fotos */
  .fotos{flex:1;padding:24px 24px 24px 22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr;gap:12px}
  .foto{border-radius:14px;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 14px rgba(13,79,68,.22);background:#ddd}
  .foto img{display:block;width:100%;height:100%;object-fit:cover}
  .foto.grande{grid-column:1 / 3}
  .foto.grande img{object-position:50% 60%}
  .foto.cartas img{object-position:60% 55%}
  .foto.bici img{object-position:45% 40%}

  .sello{position:absolute;right:44px;top:42px;background:var(--crema);color:var(--verde-osc);font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="hoja" viewBox="0 0 100 100">
      <path d="M50 4C20 22 10 52 22 80c6 13 18 17 28 16 10 1 22-3 28-16C90 52 80 22 50 4Z" fill="#9ccc3c"/>
      <path d="M50 14v82M50 40l-14-10M50 56l-18-12M50 72l-16-10M50 40l14-10M50 56l18-12M50 72l16-10" stroke="#0d4f44" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="lienzo">
  <section class="panel">
    <svg class="hoja h1"><use href="#hoja"/></svg>
    <div class="logo"><img src="fotos/logo_ekuwun_rec.png" alt="Ekuwün Acción ecologista"></div>
    <h1>¡Volvamos a<br><span>encontrarnos!</span></h1>
    <p class="bajada">Abrimos nuestras puertas a nuevas personas. Te invitamos a una <b>primera reunión</b> para conocernos y proyectar lo que viene.</p>

    <div class="encuentro">
      <div class="calendario">
        <div class="dia-sem">Jueves</div>
        <div class="num">22</div>
        <div class="mes">Octubre</div>
      </div>
      <div class="detalles">
        <div class="dato">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9ccc3c" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2.2"/></svg>
          <div class="grande">18:00 horas</div>
        </div>
        <div class="dato">
          <svg viewBox="0 0 24 24" fill="none" stroke="#9ccc3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9.5" r="2.6"/></svg>
          <div><div class="grande">León Gallo 98</div><div class="peq">Temuco</div></div>
        </div>
      </div>
    </div>

    <p class="lema">Tenemos mucho por hacer. <span>¡Sumemos manos, ideas y voluntades!</span></p>
  </section>

  <section class="fotos">
    <div class="foto grande"><img src="fotos/grupo.jpg" alt=""></div>
    <div class="foto cartas"><img src="fotos/cartas.jpg" alt=""></div>
    <div class="foto bici"><img src="fotos/bicicleta.jpg" alt=""></div>
  </section>
  <div class="sello">¿Quieres ser socia o socio?</div>
</div>

</body>
</html>
