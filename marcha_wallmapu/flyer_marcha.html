<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcha Wallmapu</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@700&family=Oswald:wght@500;700&family=Patrick+Hand+SC&display=block" rel="stylesheet">
<style>
  :root{
    --papel:#8d9f92;
    --tinta:#26332c;
    --neon:#c6f5bd;
    --brillo:#7dff5c;
    --crema:#f4ead3;
    --rojo:#d23a3a;
    --morado:#5a2370;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--papel)}
  @page{size:540px 675px;margin:0}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;width:540px;height:675px;overflow:hidden}
  .fondo{position:absolute;inset:0;overflow:hidden}
  body{width:540px;height:675px;overflow:hidden;position:relative}

  /* Fondo de papel de diario */
  .diario{position:absolute;inset:-10px;columns:7;column-gap:9px;padding:6px;font-family:'Times New Roman',serif;font-size:7.6px;line-height:1.15;color:rgba(30,42,36,.30);text-align:left;hyphens:auto;transform:rotate(-1.5deg)}
  .diario h3{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;line-height:1;color:rgba(30,42,36,.22);margin:4px 0 3px}
  .grano{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply}

  .paisaje{position:absolute;left:0;top:0;width:540px;height:675px}

  /* Foto tipo recorte */
  .recorte{position:absolute;left:118px;top:26px;width:292px;transform:rotate(-2deg);filter:drop-shadow(0 6px 9px rgba(0,0,0,.35))}

  .pegatina{position:absolute;left:372px;top:226px;transform:rotate(8deg);background:#f5d33f;color:#1d1d1b;font-family:'Patrick Hand SC',cursive;-webkit-text-stroke:.6px #1d1d1b;font-size:22px;padding:7px 12px 5px;box-shadow:0 3px 6px rgba(0,0,0,.3);clip-path:polygon(0 6%,100% 0,98% 100%,2% 94%)}
  .pegatina b{color:var(--rojo);font-weight:400}

  /* Cintas negras */
  .cinta{position:absolute;background:#141615;color:var(--neon);font-family:'Patrick Hand SC',cursive;-webkit-text-stroke:1.3px var(--neon);letter-spacing:.04em;text-align:center;white-space:nowrap;
    text-shadow:0 0 5px rgba(140,255,110,.55),0 0 12px rgba(125,255,92,.30);
    box-shadow:0 5px 10px rgba(0,0,0,.35)}
  .cinta::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);pointer-events:none}
  .c1{left:70px;top:320px;width:400px;font-size:44px;line-height:1;padding:10px 0 8px;transform:rotate(-2deg);
    clip-path:polygon(0 8%,3% 0,30% 4%,62% 0,97% 3%,100% 12%,98.5% 50%,100% 92%,70% 100%,40% 96%,8% 100%,1.5% 90%,0 50%)}
  .c2{left:16px;top:383px;width:512px;font-size:50px;line-height:1;padding:10px 0 8px;transform:rotate(1.2deg);
    clip-path:polygon(1.5% 0,35% 4%,68% 0,99% 5%,100% 50%,98.5% 100%,60% 95%,25% 100%,0 96%,1.2% 50%)}

  /* Papel crema con la fecha */
  .papel{position:absolute;left:44px;top:452px;width:452px;height:210px;background:var(--crema);transform:rotate(-.6deg);
    clip-path:polygon(0 0,100% 3%,96% 22%,100% 40%,97.5% 62%,100% 82%,98% 100%,74% 97%,52% 100%,30% 96.5%,3% 100%,4.5% 76%,0 55%,3.5% 34%,0.5% 16%);
    box-shadow:inset 0 0 40px rgba(150,120,60,.18)}
  .papel .fecha{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:'Patrick Hand SC',cursive;-webkit-text-stroke:1.1px var(--rojo);font-size:40px;line-height:1;letter-spacing:.03em;color:var(--rojo);letter-spacing:.5px}
  .papel .lugar{position:absolute;left:0;right:0;top:94px;text-align:center;font-family:'Caveat',cursive;font-size:34px;color:var(--morado)}
  .papel .convoca{position:absolute;left:0;right:0;top:144px;line-height:1.35;text-align:center;font-family:'Oswald',sans-serif;font-weight:500;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:#3a3a33}
  .papel .convoca b{color:var(--tinta);font-weight:700}
  .papel .convoca{font-size:12px !important;letter-spacing:.08em !important}
  .papel .logo{top:138px;position:absolute;width:60px;height:60px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .papel .logo.izq{left:24px}
  .papel .logo.der{right:22px}
</style>
</head>
<body>

<div class="fondo"><div class="diario" id="diario"></div></div>
<svg class="grano" width="540" height="675"><filter id="r"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .25  0 0 0 0 .22  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#r)"/></svg>

<!-- Paisaje del Wallmapu: volcán nevado, cordillera y araucarias -->
<svg class="paisaje" viewBox="0 0 540 675">
  <defs>
    <symbol id="arauc" viewBox="-40 -120 80 125" overflow="visible">
      <path d="M0 0V-96" stroke="#1d3a2b" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M-38-76Q-41-84-35-86Q0-92 35-86Q41-84 38-76Q20-81 0-81Q-20-81-38-76Z" fill="#1d3a2b"/>
      <path d="M-31-88Q-33-96-28-98Q0-104 28-98Q33-96 31-88Q15-92 0-92Q-15-92-31-88Z" fill="#234733"/>
      <path d="M-21-99Q-22-106-18-108Q0-113 18-108Q22-106 21-99Q10-102 0-102Q-10-102-21-99Z" fill="#2a573d"/>
      <path d="M-11-108Q0-117 11-108Q0-110-11-108Z" fill="#2f6044"/>
    </symbol>
    <symbol id="pino" viewBox="-12 -60 24 62" overflow="visible">
      <path d="M0-58L11 0H-11Z" fill="#1f4532"/><path d="M0-58L11 0H0Z" fill="#183828"/>
    </symbol>
    <clipPath id="borde"><path d="M-10 0H550V560Q520 590 480 575Q430 600 380 585Q320 612 260 592Q200 615 140 590Q80 612 30 588Q5 600-10 590Z"/></clipPath>
  </defs>
  <g clip-path="url(#borde)">
    <!-- cordillera del fondo -->
    <path d="M-10 260L40 190L95 140L150 70L190 30L235 95L270 150L300 120L340 60L372 25L410 80L455 135L500 110L550 150V330H-10Z" fill="#6f7fb3"/>
    <path d="M190 30L150 70L95 140L40 190L-10 260V300L60 250L120 200L160 150L178 95Z" fill="#f2c46a"/>
    <path d="M372 25L340 60L300 120L280 160L330 120L355 80Z" fill="#f2c46a"/>
    <path d="M190 30L178 60L200 70L218 72Z" fill="#fbf3e2"/>
    <path d="M500 110L470 130L455 160L490 140Z" fill="#f2c46a"/>
    <!-- volcán nevado -->
    <path d="M330 300L405 125Q415 112 432 112Q448 112 458 125L550 300Z" fill="#7a86c0"/>
    <path d="M405 125Q415 112 432 112Q448 112 458 125L478 165L462 160L450 172L436 158L420 176L410 160L392 168Z" fill="#fbf7ef"/>
    <path d="M405 125L392 168L370 220L360 300L330 300Z" fill="#e8b85a" opacity=".85"/>
    <!-- lomas y bosque -->
    <path d="M-10 300Q60 255 130 285Q190 310 250 290Q330 262 400 290Q470 315 550 280V420H-10Z" fill="#5c9b57"/>
    <path d="M-10 335Q80 300 170 330Q260 360 340 330Q430 300 550 335V450H-10Z" fill="#3f7d4a"/>
    <!-- río -->
    <path d="M-10 455Q60 430 120 452Q160 468 130 500Q100 530 160 560L120 600H-10Z" fill="#3e8fb8"/>
    <path d="M-10 470Q55 448 105 466Q132 478 110 502Q92 524 130 556L112 580Q70 540 92 505Q108 482 70 474Q30 468-10 482Z" fill="#8fd0e8" opacity=".75"/>
    <!-- primer plano -->
    <path d="M-10 410Q50 380 110 400Q60 430 40 470Q20 520-10 540Z" fill="#8a6a3c"/>
    <path d="M550 380Q470 395 440 440Q420 490 470 540Q510 570 550 560Z" fill="#7a5c33"/>
    <path d="M550 420Q500 440 495 480Q495 520 550 535Z" fill="#a8823f"/>
    <path d="M140 600Q200 520 300 540Q400 560 470 600Z" fill="#2f6a3f"/>
  </g>
  <!-- araucarias -->
  <use href="#arauc" x="2" y="252" width="80" height="125" transform="translate(0 0)"/>
  <use href="#arauc" x="30" y="282" width="62" height="96"/>
  <use href="#arauc" x="-14" y="300" width="56" height="88"/>
  <use href="#arauc" x="455" y="235" width="86" height="134"/>
  <use href="#arauc" x="425" y="275" width="60" height="94"/>
  <use href="#arauc" x="490" y="298" width="54" height="84"/>
  <use href="#pino" x="98" y="300" width="20" height="52"/>
  <use href="#pino" x="112" y="310" width="16" height="42"/>
  <use href="#pino" x="408" y="300" width="18" height="48"/>
</svg>

<img class="recorte" src="img/megafono_recorte.png" alt="">
<div class="pegatina">¡NO A <b>DOMINGA</b>!</div>

<div class="cinta c1">MARCHA AMBIENTAL</div>
<div class="cinta c2">WALLMAPU SE DEFIENDE</div>

<div class="papel">
  <div class="fecha">SÁBADO 31 DE OCTUBRE<br>12:00 HRS</div>
  <div class="lugar">Plaza del Hospital – Temuko</div>
  <div class="convoca">Autoconvocada por<br><b>organizaciones ambientales del Wallmapu</b></div>
  <img class="logo izq" src="img/logo_mujeres_ambientalistas.png" alt="Mujeres Ambientalistas Araucanía">
  <img class="logo der" src="img/logo_amas_lautaro.png" alt="A.M.A.S Lautaro">
</div>

<script>
  // Texto de relleno para simular papel de diario
  const palabras = "la tierra agua río bosque comunidad territorio defensa semilla lluvia volcán humedal memoria raíz pueblo cordillera montaña siembra lucha vida cuidado viento lago canelo araucaria piñón tiempo sur mar costa calle plaza voz camino nativo ñirre roble coigüe lenga huerto cosecha minga ruka lof kimün".split(" ");
  let s = 0; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let html = "";
  for (let b = 0; b < 26; b++) {
    if (b % 4 === 0) html += "<h3>" + palabras[Math.floor(rnd()*palabras.length)].toUpperCase() + "</h3>";
    let p = "";
    for (let i = 0; i < 70; i++) p += palabras[Math.floor(rnd()*palabras.length)] + " ";
    html += "<p>" + p + "</p>";
  }
  document.getElementById("diario").innerHTML = html;
</script>
</body>
</html>
