name: Sincronizar denuncias verificadas

# Copia las denuncias marcadas como VERIFICADA en la planilla Google
# hacia docs/data/denuncias.geojson, que alimenta el mapa público.

on:
  schedule:
    - cron: '0 */3 * * *'      # cada 3 horas
  workflow_dispatch:            # o cuando lo ejecutes a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Traer denuncias verificadas
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python scripts/sync_denuncias.py

      - name: Publicar cambios
        run: |
          if [ -n "$(git status --porcelain docs/data/denuncias.geojson)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/denuncias.geojson
            git commit -m "Denuncias verificadas actualizadas (automático)"
            git push
          else
            echo "Sin cambios que publicar."
          fi
